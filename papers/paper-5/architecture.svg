<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#07121f"/><stop offset="1" stop-color="#13253a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.25"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#56d6c9"/></marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#f4f8fb}.label{font:700 21px Arial,sans-serif;fill:#f4f8fb}.small{font:400 16px Arial,sans-serif;fill:#c7d5e3}.tiny{font:400 14px Arial,sans-serif;fill:#9fb5c8}.box{stroke-width:2;rx:20;filter:url(#shadow)}.flow{fill:none;stroke:#56d6c9;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="720" fill="url(#bg)"/>
  <text x="700" y="54" text-anchor="middle" class="title">Deterministic continuity memory: models propose; the substrate governs</text>

  <rect x="60" y="130" width="260" height="190" class="box" fill="#243b55" stroke="#6ea8dc"/>
  <text x="190" y="178" text-anchor="middle" class="label">Source client / model</text>
  <text x="190" y="218" text-anchor="middle" class="small">May propose a candidate</text>
  <text x="190" y="248" text-anchor="middle" class="small">Cannot write canonical state</text>
  <text x="190" y="278" text-anchor="middle" class="small">No placement or deletion right</text>

  <rect x="420" y="98" width="560" height="510" class="box" fill="#102a33" stroke="#56d6c9"/>
  <text x="700" y="145" text-anchor="middle" class="label">Deterministic continuity substrate</text>
  <rect x="475" y="180" width="450" height="68" rx="14" fill="#183f48" stroke="#56d6c9"/>
  <text x="700" y="207" text-anchor="middle" class="small">Admission boundary</text>
  <text x="700" y="231" text-anchor="middle" class="tiny">identity • source lineage • scope • risk • confidence</text>
  <rect x="475" y="272" width="450" height="68" rx="14" fill="#183f48" stroke="#56d6c9"/>
  <text x="700" y="299" text-anchor="middle" class="small">Deterministic disposition</text>
  <text x="700" y="323" text-anchor="middle" class="tiny">HOLD • context • authority • quarantine • deny</text>
  <rect x="475" y="364" width="450" height="68" rx="14" fill="#183f48" stroke="#56d6c9"/>
  <text x="700" y="391" text-anchor="middle" class="small">Lifecycle and history</text>
  <text x="700" y="415" text-anchor="middle" class="tiny">supersession • expiry • review • retention • restart</text>
  <rect x="475" y="456" width="450" height="68" rx="14" fill="#183f48" stroke="#56d6c9"/>
  <text x="700" y="483" text-anchor="middle" class="small">Receipts and authorized recall</text>
  <text x="700" y="507" text-anchor="middle" class="tiny">proof chain • exact provenance • scoped evidence packet</text>
  <text x="700" y="565" text-anchor="middle" class="small">Canonical state remains outside inference</text>

  <rect x="1080" y="130" width="260" height="190" class="box" fill="#243b55" stroke="#6ea8dc"/>
  <text x="1210" y="178" text-anchor="middle" class="label">Receiving client / model</text>
  <text x="1210" y="218" text-anchor="middle" class="small">Reads an authorized slice</text>
  <text x="1210" y="248" text-anchor="middle" class="small">Reasons probabilistically</text>
  <text x="1210" y="278" text-anchor="middle" class="small">May propose; cannot govern</text>

  <path d="M320 225 C355 225 380 225 420 225" class="flow"/>
  <path d="M980 225 C1020 225 1045 225 1080 225" class="flow"/>

  <rect x="125" y="410" width="235" height="120" rx="18" fill="#341f2d" stroke="#e48aa9" stroke-width="2"/>
  <text x="242" y="450" text-anchor="middle" class="small">Probabilistic variation</text>
  <text x="242" y="480" text-anchor="middle" class="tiny">wrong field • altered citation</text>
  <text x="242" y="505" text-anchor="middle" class="tiny">timeout • malformed output</text>
  <path d="M360 470 C390 470 402 470 420 470" fill="none" stroke="#e48aa9" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1040" y="410" width="235" height="120" rx="18" fill="#20372f" stroke="#75d29a" stroke-width="2"/>
  <text x="1158" y="450" text-anchor="middle" class="small">Deterministic outcome</text>
  <text x="1158" y="480" text-anchor="middle" class="tiny">admit • hold • deny</text>
  <text x="1158" y="505" text-anchor="middle" class="tiny">regardless of model claim</text>
  <path d="M980 470 C1000 470 1015 470 1040 470" fill="none" stroke="#75d29a" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="700" y="672" text-anchor="middle" class="tiny">Research boundary: synthetic local evaluation; no production or universal-portability claim</text>
</svg>

