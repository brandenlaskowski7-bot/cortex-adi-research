name: Reply to agent-intelligence state eligibility discussion

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reply-once:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'huggingface_hub>=0.30,<1'
      - name: Publish the approved response once
        shell: python
        run: |
          import os
          from huggingface_hub import HfApi

          repo_id = 'huggingface/HuggingDiscussions'
          discussion_num = 89
          response = (
              'Really enjoying this thread—especially the refusal to turn a run into one score wearing a fake moustache. '
              'The capability and violation split leaves room for a third lens: whether the state an agent relied on was still eligible to influence the run.\n\n'
              'For Tapoo, a deliberately nasty test might give the agent a map observation that was valid, then make it stale, superseded, or contradicted by a newer observation. '
              'A plan built from that map can look strategically sound while its premise has quietly expired. That is not quite a planning failure or a formatting failure; it is a state-eligibility failure.\n\n'
              'I have been experimenting with small synthetic tests that attach an inspectable receipt to state: current or historical, in scope or not, provenance-supported or not, superseded or unresolved. '
              'Would a separate \"eligible evidence\" dimension be useful in Tapoo, or would it duplicate an existing violation category?'
          )
          api = HfApi(token=os.environ['HF_TOKEN'])
          discussion = api.get_discussion_details(
              repo_id, discussion_num, repo_type='space'
          )
          existing = [
              event.content for event in discussion.events
              if getattr(event, 'type', None) == 'comment'
          ]
          if response in existing:
              print('already present')
          else:
              api.comment_discussion(
                  repo_id, discussion_num, response, repo_type='space'
              )
              print(
                  'published: '
                  'https://huggingface.co/spaces/huggingface/HuggingDiscussions/discussions/89'
              )
