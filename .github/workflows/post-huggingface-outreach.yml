name: Post approved Hugging Face outreach questions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  start-conversations:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'huggingface_hub>=0.30,<1'
      - name: Post the approved questions once
        shell: python
        run: |
          import os
          from huggingface_hub import HfApi

          posts = [
              (
                  'agent-memory-leaderboard/leaderboard',
                  'Question on governance-focused synthetic failure modes',
                  'I appreciate the emphasis on a fixed evaluation contract and on publishing only verified rows. I am building a small synthetic lab around a narrower question: when should a memory be current, historical, held, denied, or unresolved under explicit time, scope, provenance, and replacement rules? Does the AML evaluation have a preferred way for a small public synthetic test suite to contribute an additional governance-focused failure mode without overstating its scope?',
              ),
              (
                  'fisherman611/agent-memory-techniques',
                  'Question: when should retained context become ineligible?',
                  'I like the way this makes the practical tradeoffs between buffer, window, and summary memory visible. I am exploring a complementary issue: even if context is retained efficiently, when should it no longer be eligible to return? I built a tiny synthetic test around expiry, conflicting candidates, scope, provenance, and supersession. Have you run into cases where a summary remains available but should be treated as historical or unresolved instead of simply retrieved?',
              ),
              (
                  'clinical-agent-memory-bench/meme-bench',
                  'Question on useful public explorers without exposure risk',
                  'I respect the decision to keep the public explorer limited to processed aggregate results and to exclude raw clinical data and identifiers. I am working on a fully synthetic governed-memory lab for a different domain, where the goal is to make decisions and receipts inspectable without exposing the underlying system or any real records. What design decision helped you most in making the public explorer useful without turning it into an exposure risk?',
              ),
          ]
          api = HfApi(token=os.environ['HF_TOKEN'])
          for repo_id, title, body in posts:
              existing = {item.title for item in api.get_repo_discussions(
                  repo_id, repo_type='space'
              )}
              if title in existing:
                  print(f'already present: {repo_id} :: {title}')
                  continue
              discussion = api.create_discussion(
                  repo_id, title, description=body, repo_type='space'
              )
              print(
                  f'published: {repo_id} :: {title} :: '
                  f'https://huggingface.co/spaces/{repo_id}/discussions/{discussion.num}'
              )
